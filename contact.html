<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom | Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">✈ TravelBloom</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html" aria-current="page">Contact Us</a>
    </div>
  </nav>

  <main class="page contact-layout">
    <section>
      <h1>Contact Us</h1>
      <p>
        Have a question about your next adventure?
        Fill out the form below.
      </p>
      <p>This is a demo contact form for our travel project.</p>
    </section>

    <section class="panel">
      <h2>Get in touch</h2>

      <form id="contact-form" class="contact-form">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your name"
          autocomplete="name"
          required
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Write your message here"
          required
        ></textarea>

        <button type="submit">Submit</button>

        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 TravelBloom. Explore the world with us.</p>
  </footer>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      status.textContent =
        "Thank you! Your demo form was completed successfully. " +
        "No message has been sent.";

      form.reset();
    });
  </script>
</body>
</html>
